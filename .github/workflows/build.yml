# Save this single file as .github/workflows/build.yml in a GitHub repository.
# Catalog snapshot: 2026-09-18. All data and the generator are embedded below.
# A run rebuilds this snapshot; it does not scrape sources or refresh recommendations.
# The workflow produces a downloadable artifact, without changing repository files.
name: Build media catalog

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate the complete catalog
        shell: bash
        run: |
          python3 - <<'PY_MEDIA_CATALOG'
          from pathlib import Path
          text = Path('.github/workflows/build.yml').read_text(encoding='utf-8')
          start = '# BEGIN EMBEDDED CATALOG GENERATOR\n'
          end = '# END EMBEDDED CATALOG GENERATOR'
          body = text.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines()
          assert lines and all(line.startswith('#|') for line in lines), 'Invalid embedded generator'
          source = '\n'.join(line[2:] for line in lines)
          exec(compile(source, 'embedded_catalog.py', 'exec'), {'__name__': '__main__'})
          PY_MEDIA_CATALOG

      - name: Check generated outputs
        shell: bash
        run: |
          python3 - <<'PY_VALIDATE_CATALOG'
          import csv, hashlib, json
          from pathlib import Path
          root = Path('dist')
          data = json.loads((root / 'catalog.json').read_text(encoding='utf-8'))
          rows = data['items']
          assert len(rows) == data['stats']['entries'] == 1256
          assert len(data['index']) == 506
          assert len({x['id'] for x in rows}) == len(rows)
          assert len(data['genres']) == 22
          ids = {x['id'] for x in rows}
          assert all(r['ids'] and all(i in ids for i in r['ids']) for r in data['index'])
          assert all(x['synopsis'] and x['imdb'].startswith('https://www.imdb.com/') for x in rows)
          assert all(x['audio'] in ('E', 'D') for x in rows if x['recommended'])
          with (root / 'catalog.csv').open(encoding='utf-8-sig', newline='') as f:
              assert len(list(csv.DictReader(f))) == len(rows)
          assert '__PAYLOAD__' not in (root / 'index.html').read_text(encoding='utf-8')
          manifest = json.loads((root / 'SHA256SUMS.json').read_text())
          for name, digest in manifest.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          print('Validated catalog records, Reddit mappings, English filters, CSV rows and file hashes.')
          PY_VALIDATE_CATALOG

      - name: Test importer behavior
        shell: bash
        run: |
          cd dist
          python3 -m unittest test_import_catalog.py

      - name: Downloadable catalog
        uses: actions/upload-artifact@v7
        with:
          name: media-catalog
          path: |
            dist/
            !dist/__pycache__/
          if-no-files-found: error
          retention-days: 30

