#|(out/'import-catalog.py').write_text('#!/usr/bin/env python3\n"""Plan and apply a catalog import through Sonarr/Radarr v3 APIs.\n\nDefault is a read-only preview of ten titles. Apply uses a saved plan and always\nadds unmonitored entries with automatic searches disabled. Existing entries\nare never edited. Run on the seedbox; credentials are never written to reports.\n"""\nimport argparse\nimport copy\nimport csv\nimport getpass\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport sys\nimport time\nimport unicodedata\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nimport xml.etree.ElementTree as ET\n\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, *args, **kwargs):\n        return None\n\n\nclass Arr:\n    def __init__(self, name, url, key):\n        parsed = urllib.parse.urlsplit(url)\n        if parsed.scheme not in (\'http\', \'https\') or not parsed.hostname or parsed.username or parsed.query or parsed.fragment:\n            raise ValueError(\'Use an HTTP(S) application URL, including its base path, without credentials or query parameters.\')\n        self.name, self.url, self.key = name, url.rstrip(\'/\'), key\n        self.entity = \'series\' if name == \'sonarr\' else \'movie\'\n        self.idkey = \'tvdbId\' if name == \'sonarr\' else \'tmdbId\'\n        self.opener = urllib.request.build_opener(NoRedirect)\n\n    def request(self, route, data=None):\n        url = self.url + \'/api/v3/\' + route\n        body = None if data is None else json.dumps(data).encode(\'utf-8\')\n        request = urllib.request.Request(url, data=body, headers={\'X-Api-Key\': self.key, \'Content-Type\':\'application/json\', \'Accept\':\'application/json\'})\n        try:\n            with self.opener.open(request, timeout=40) as response:\n                return json.load(response)\n        except urllib.error.HTTPError as error:\n            raise RuntimeError(f\'{self.name}: HTTP {error.code} on {route.split("?")[0]}; check the application URL, key and app logs.\') from None\n        except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, OSError):\n            raise RuntimeError(f\'{self.name}: connection or JSON response failed on {route.split("?")[0]}. A timed-out POST is not retried automatically.\') from None\n\n\ndef choose(label, values, display):\n    if not values:\n        raise RuntimeError(label + \': no choices exist. Configure this in the application first.\')\n    print(\'\\n\' + label)\n    for number, value in enumerate(values, 1):\n        print(f\'  {number}. {display(value)}\')\n    if len(values) == 1:\n        print(\'  Using the only configured choice.\')\n        return values[0]\n    while True:\n        answer = input(\'Choose number: \').strip()\n        if answer.isdigit() and 1 <= int(answer) <= len(values):\n            return values[int(answer)-1]\n\n\ndef connect(name, supplied_url=None):\n    config_root = Path.home()/\'.config\'\n    names = (\'Sonarr\',\'sonarr\',\'NzbDrone\',\'nzbdrone\') if name==\'sonarr\' else (\'Radarr\',\'radarr\')\n    paths = sorted({p.resolve() for n in names for p in [config_root/n/\'config.xml\'] if p.is_file()})\n    url, key = supplied_url or os.environ.get(name.upper()+\'_URL\',\'\'), os.environ.get(name.upper()+\'_API_KEY\',\'\')\n    if paths and (not url or not key):\n        path = choose(name+\' configuration\', paths, str)\n        tree = ET.parse(path).getroot()\n        if not key:\n            key = tree.findtext(\'ApiKey\') or \'\'\n        if not url:\n            bind = tree.findtext(\'BindAddress\') or \'127.0.0.1\'\n            if bind in (\'*\',\'0.0.0.0\',\'::\',\'[::]\'):\n                bind = \'127.0.0.1\'\n            if \':\' in bind and not bind.startswith(\'[\'):\n                bind=\'[\'+bind+\']\'\n            port = tree.findtext(\'Port\')\n            base = (tree.findtext(\'UrlBase\') or \'\').strip(\'/\')\n            if port:\n                url = f\'http://{bind}:{port}\' + (\'/\'+base if base else \'\')\n    if not url:\n        url = input(name+\' base URL (include /sonarr or /radarr if used): \').strip()\n    if not key:\n        key = getpass.getpass(name+\' API key (Settings > General): \').strip()\n    client = Arr(name,url,key)\n    try:\n        status=client.request(\'system/status\')\n    except RuntimeError:\n        print(name+\': automatic connection did not succeed. Enter the working application base URL.\')\n        url=input(\'Base URL: \').strip()\n        if input(\'Use a different API key? [y/N]: \').strip().lower()==\'y\':\n            key=getpass.getpass(\'API key: \').strip()\n        client=Arr(name,url,key)\n        status=client.request(\'system/status\')\n    print(name+\': connected, version \'+str(status.get(\'version\',\'unknown\')))\n    return client\n\n\ndef normalized(value):\n    value=unicodedata.normalize(\'NFKD\',str(value)).encode(\'ascii\',\'ignore\').decode().lower()\n    return re.sub(r\'[^a-z0-9]\',\'\',value)\n\n\ndef route(row):\n    form=row[\'format\'].lower()\n    # Some editorial rows group several works; they need individual database IDs.\n    if \'film series\' in form or row[\'title\'] in (\'Higurashi: When They Cry – Gou / Sotsu\',\'Justice League / Justice League Unlimited\',\'Rebuild of Evangelion\',\'The Devil\\\'s Ball\'):\n        return \'review\'\n    if \'film\' in form or \'short\' in form:\n        return \'radarr\'\n    return \'sonarr\'\n\n\ndef exact_match(row, candidates, idkey):\n    eligible={}\n    names={normalized(row[\'title\'])}\n    # Only explicit alternate names in a catalog title are treated as aliases.\n    names.update(normalized(t.strip()) for t in row[\'title\'].split(\' / \'))\n    for candidate in candidates:\n        aliases={normalized(candidate.get(\'title\',\'\')),normalized(candidate.get(\'originalTitle\',\'\'))}\n        aliases.update(normalized(t.get(\'title\',\'\')) for t in candidate.get(\'alternateTitles\',[]) if isinstance(t,dict))\n        if candidate.get(idkey) and names & aliases and int(candidate.get(\'year\') or 0)==row[\'year\']:\n            eligible[candidate[idkey]]=candidate\n    return next(iter(eligible.values())) if len(eligible)==1 else None\n\n\ndef bucket(row, app):\n    if app==\'radarr\':\n        return \'Movies\'\n    if row[\'format\'].startswith((\'Anime\',\'Donghua\')):\n        return \'Anime\'\n    if row[\'group\']==\'Cartoons / animation\':\n        return \'Cartoons\'\n    return \'TV Shows\'\n\n\ndef payload_for(candidate, row, app, settings):\n    resource=copy.deepcopy(candidate)\n    for key in (\'id\',\'path\',\'statistics\',\'movieFile\',\'movieFileId\',\'hasFile\'):\n        resource.pop(key,None)\n    resource.update(rootFolderPath=settings[\'root\'],qualityProfileId=settings[\'profile\'],monitored=False,tags=[])\n    if app==\'sonarr\':\n        resource[\'seriesType\']=\'anime\' if bucket(row,app)==\'Anime\' else \'standard\'\n        resource[\'seasonFolder\']=True\n        resource[\'seasons\']=[dict(s,monitored=False) for s in resource.get(\'seasons\',[])]\n        resource[\'addOptions\']={\'monitor\':\'none\',\'searchForMissingEpisodes\':False,\'searchForCutoffUnmetEpisodes\':False}\n    else:\n        resource[\'minimumAvailability\']=\'released\'\n        resource[\'addOptions\']={\'searchForMovie\':False}\n    return resource\n\n\ndef write_json(path, value):\n    path=Path(path)\n    temporary=path.with_suffix(path.suffix+\'.tmp\')\n    temporary.write_text(json.dumps(value,ensure_ascii=False,indent=2)+\'\\n\',encoding=\'utf-8\')\n    temporary.chmod(0o600)\n    temporary.replace(path)\n\n\ndef preview(args, clients):\n    catalog=json.loads(Path(args.catalog).read_text(encoding=\'utf-8\'))\n    rows=catalog[\'items\']\n    rows=[r for r in rows if r[\'audio\'] in ((\'E\',\'D\',\'P\',\'W\') if args.include_partial else (\'E\',\'D\'))]\n    if args.scope==\'matches\':\n        rows=[r for r in rows if r[\'matches\']!=\'Reddit inventory\']\n    elif args.scope==\'reddit\':\n        rows=[r for r in rows if r[\'reddit\']]\n    elif args.scope==\'top\':\n        rows=[r for r in rows if r[\'top\']]\n    # Alternate media types in the initial preview so both apps get exercised.\n    rows.sort(key=lambda r:(not r[\'top\'],r[\'title\'].casefold(),r[\'year\']))\n    if args.limit:\n        tv=[r for r in rows if route(r)==\'sonarr\']; movies=[r for r in rows if route(r)==\'radarr\']; other=[r for r in rows if route(r)==\'review\']\n        mixed=[]\n        while tv or movies:\n            if tv:mixed.append(tv.pop(0))\n            if movies:mixed.append(movies.pop(0))\n        rows=(mixed+other)[:args.limit]\n    roots={a:c.request(\'rootfolder\') for a,c in clients.items()}\n    profiles={a:c.request(\'qualityprofile\') for a,c in clients.items()}\n    existing={a:{int(v[c.idkey]) for v in c.request(c.entity) if v.get(c.idkey)} for a,c in clients.items()}\n    choices={}\n    for app in (\'sonarr\',\'radarr\'):\n        for group in sorted({bucket(r,app) for r in rows if route(r)==app}):\n            root=choose(app+\' / \'+group+\' destination\',roots[app],lambda r:r[\'path\'])\n            profile=choose(app+\' / \'+group+\' quality profile\',profiles[app],lambda p:p[\'name\'])\n            choices[app+\'|\'+group]={\'root\':root[\'path\'],\'profile\':profile[\'id\'],\'profile_name\':profile[\'name\']}\n    plan={\'version\':1,\'scope\':args.scope,\'catalog_date\':catalog[\'date\'],\'instances\':{a:c.url for a,c in clients.items()},\'choices\':choices,\'rows\':[]}\n    planned=set()\n    for number,row in enumerate(rows,1):\n        app=route(row)\n        record={\'catalog_id\':row[\'id\'],\'title\':row[\'title\'],\'year\':row[\'year\'],\'format\':row[\'format\'],\'app\':app,\'audio\':row[\'audio\'],\'status\':\'review\',\'reason\':\'Grouped work or excerpt: resolve individual entries manually.\'}\n        if app!=\'review\':\n            client=clients[app]\n            try:\n                term=\'imdb:\'+row[\'imdb\'].split(\'/title/\')[1].split(\'/\')[0] if app==\'radarr\' and \'/title/tt\' in row[\'imdb\'] else row[\'title\'].split(\' / \')[0]\n                results=client.request(client.entity+\'/lookup?\'+urllib.parse.urlencode({\'term\':term}))\n                if isinstance(results,dict):results=[results]\n                candidate=exact_match(row,results,client.idkey)\n                if candidate:\n                    identity=int(candidate[client.idkey]); token=(app,identity)\n                    record.update(database_id=identity,matched_title=candidate[\'title\'],matched_year=candidate.get(\'year\'),choice=app+\'|\'+bucket(row,app))\n                    if identity in existing[app]:\n                        record.update(status=\'existing\',reason=\'Already in the application; no changes planned.\')\n                    elif token in planned:\n                        record.update(status=\'duplicate\',reason=\'Another catalog row maps to the same database ID.\')\n                    else:\n                        planned.add(token)\n                        settings=choices[record[\'choice\']]\n                        record.update(status=\'ready\',reason=\'Unique title/alias and year match; add unmonitored.\',payload=payload_for(candidate,row,app,settings))\n                else:\n                    record.update(reason=\'No unique exact title/alias AND year match. Review database choices.\',candidates=[{\'title\':x.get(\'title\'), \'year\':x.get(\'year\'), \'id\':x.get(client.idkey)} for x in results[:8]])\n            except RuntimeError as error:\n                record.update(status=\'error\',reason=str(error))\n            time.sleep(0.2)\n        plan[\'rows\'].append(record)\n        print(f"[{number}/{len(rows)}] {record[\'status\'].upper()}: {row[\'title\']} ({row[\'year\']})")\n        write_json(args.plan,plan)\n    report=Path(args.plan).with_suffix(\'.csv\')\n    with report.open(\'w\',encoding=\'utf-8-sig\',newline=\'\') as f:\n        writer=csv.writer(f);writer.writerow([\'Status\',\'Catalog title\',\'Year\',\'Application\',\'Matched title\',\'Database ID\',\'Destination\',\'Profile\',\'Reason\',\'Candidate alternatives\'])\n        for r in plan[\'rows\']:\n            setting=choices.get(r.get(\'choice\'),{})\n            values=[r[\'status\'],r[\'title\'],r[\'year\'],r[\'app\'],r.get(\'matched_title\',\'\'),r.get(\'database_id\',\'\'),setting.get(\'root\',\'\'),setting.get(\'profile_name\',\'\'),r[\'reason\'],json.dumps(r.get(\'candidates\',[]),ensure_ascii=False)]\n            writer.writerow(["\'"+str(v) if str(v).startswith((\'=\',\'+\',\'-\',\'@\',\'\\t\',\'\\r\')) else v for v in values])\n    counts={s:sum(r[\'status\']==s for r in plan[\'rows\']) for s in (\'ready\',\'existing\',\'duplicate\',\'review\',\'error\')}\n    print(\'\\nREAD-ONLY PREVIEW COMPLETE:\',json.dumps(counts))\n    print(\'Review\',report,\'and\',args.plan,\'before using --apply. No library entries were added or edited.\')\n\n\ndef apply(args,clients):\n    plan=json.loads(Path(args.plan).read_text(encoding=\'utf-8\'))\n    if plan.get(\'version\')!=1:\n        raise RuntimeError(\'Unsupported plan version.\')\n    for app,c in clients.items():\n        if plan[\'instances\'][app].rstrip(\'/\')!=c.url:\n            raise RuntimeError(\'Application URL differs from the preview. Run a fresh preview against this instance.\')\n    roots={a:{r[\'path\'] for r in c.request(\'rootfolder\')} for a,c in clients.items()}\n    profiles={a:{p[\'id\'] for p in c.request(\'qualityprofile\')} for a,c in clients.items()}\n    existing={a:{int(r[c.idkey]) for r in c.request(c.entity) if r.get(c.idkey)} for a,c in clients.items()}\n    ready=[r for r in plan[\'rows\'] if r[\'status\']==\'ready\']\n    # Validate every payload before the first mutation, including a user-edited plan.\n    for row in ready:\n        app=row[\'app\']; c=clients[app]; p=row[\'payload\']\n        if int(p[c.idkey])!=row[\'database_id\'] or p[\'rootFolderPath\'] not in roots[app] or p[\'qualityProfileId\'] not in profiles[app]:\n            raise RuntimeError(\'A database ID, destination or quality profile changed; create a fresh preview.\')\n    outcomes=[]\n    for row in ready:\n        app=row[\'app\'];c=clients[app];identity=row[\'database_id\']\n        result={\'title\':row[\'title\'],\'app\':app,\'database_id\':identity}\n        if identity in existing[app]:\n            result[\'status\']=\'skipped-existing\'\n        else:\n            # Refetch canonical metadata by ID to avoid replaying stale lookup data.\n            try:\n                term=(\'tvdb:\' if app==\'sonarr\' else \'tmdb:\')+str(identity)\n                matches=c.request(c.entity+\'/lookup?\'+urllib.parse.urlencode({\'term\':term}))\n                if isinstance(matches,dict):matches=[matches]\n                candidate=next((r for r in matches if r.get(c.idkey)==identity),None)\n                if not candidate:\n                    raise RuntimeError(\'Database ID no longer resolves; create a fresh preview.\')\n                setting={\'root\':row[\'payload\'][\'rootFolderPath\'],\'profile\':row[\'payload\'][\'qualityProfileId\']}\n                source={\'format\':row[\'format\'],\'group\':\'Cartoons / animation\' if row[\'format\']==\'Cartoon\' else \'\',\'title\':row[\'title\']}\n                data=payload_for(candidate,source,app,setting)\n                response=c.request(c.entity,data)\n                if not response.get(\'id\'):\n                    raise RuntimeError(\'Add returned no application ID; check the application before retrying.\')\n                existing[app].add(identity)\n                result.update(status=\'added-unmonitored\',application_id=response[\'id\'])\n            except RuntimeError as error:\n                result.update(status=\'error-or-unknown\',reason=str(error))\n                outcomes.append(result)\n                write_json(Path(args.plan).with_suffix(\'.applied.json\'),outcomes)\n                print(\'STOPPED:\',row[\'title\'],str(error))\n                print(\'Earlier successful adds are recorded. Inspect the application, then rerun --apply; existing IDs will be skipped.\')\n                return 1\n        outcomes.append(result)\n        write_json(Path(args.plan).with_suffix(\'.applied.json\'),outcomes)\n        print(result[\'status\']+\': \'+row[\'title\'])\n        time.sleep(0.2)\n    print(\'Apply complete. New entries are unmonitored and no searches were requested. Existing entries were not changed.\')\n    return 0\n\n\ndef main():\n    p=argparse.ArgumentParser(description=__doc__)\n    p.add_argument(\'--catalog\',default=\'catalog.json\')\n    p.add_argument(\'--plan\',default=\'import-plan.json\')\n    p.add_argument(\'--scope\',choices=[\'all\',\'matches\',\'reddit\',\'top\'],default=\'all\',help=\'All English-compatible rows by default, including your examples and Reddit titles.\')\n    p.add_argument(\'--limit\',type=int,default=10,help=\'Preview this many rows; 0 means all selected rows.\')\n    p.add_argument(\'--include-partial\',action=\'store_true\',help=\'Also include partial-dub and wordless records for review.\')\n    p.add_argument(\'--apply\',action=\'store_true\',help=\'Apply ready rows from the saved plan; add unmonitored, with searches off.\')\n    p.add_argument(\'--sonarr-url\');p.add_argument(\'--radarr-url\')\n    args=p.parse_args()\n    if args.limit<0:p.error(\'--limit must be 0 or positive\')\n    clients={app:connect(app,getattr(args,app+\'_url\')) for app in (\'sonarr\',\'radarr\')}\n    return apply(args,clients) if args.apply else preview(args,clients)\n\n\nif __name__==\'__main__\':\n    try:\n        sys.exit(main() or 0)\n    except (RuntimeError,ValueError,KeyError,OSError,ET.ParseError) as error:\n        print(\'Stopped:\',str(error),file=sys.stderr)\n        sys.exit(1)\n    except (KeyboardInterrupt,EOFError):\n        print(\'\\nStopped. Any saved preview or apply log remains available.\',file=sys.stderr)\n        sys.exit(1)\n',encoding='utf-8')
#|(out/'test_import_catalog.py').write_text("import copy\nimport importlib.util\nimport json\nfrom pathlib import Path\nimport tempfile\nfrom types import SimpleNamespace\nimport unittest\nfrom unittest.mock import patch\nimport urllib.parse\n\nspec=importlib.util.spec_from_file_location('importer',Path(__file__).with_name('import-catalog.py'))\nm=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)\n\nclass FakeArr:\n    def __init__(self,name,candidates,existing=()):\n        self.name=name;self.url='http://localhost/'+name\n        self.entity='series' if name=='sonarr' else 'movie'\n        self.idkey='tvdbId' if name=='sonarr' else 'tmdbId'\n        self.candidates=candidates;self.existing=set(existing);self.posts=[]\n    def request(self,route,data=None):\n        if data is not None:\n            assert route==self.entity\n            self.posts.append(copy.deepcopy(data));self.existing.add(data[self.idkey])\n            return dict(data,id=100+len(self.posts))\n        if route=='rootfolder':return [{'path':'/media/'+self.name}]\n        if route=='qualityprofile':return [{'id':7,'name':'Existing quality profile'}]\n        if route==self.entity:return [{self.idkey:x,'id':x} for x in self.existing]\n        if '/lookup?' in route:\n            term=urllib.parse.parse_qs(urllib.parse.urlsplit(route).query)['term'][0]\n            if term.startswith(('tvdb:','tmdb:')):\n                return [copy.deepcopy(x) for x in self.candidates if x[self.idkey]==int(term.split(':')[1])]\n            return [copy.deepcopy(x) for x in self.candidates]\n        raise AssertionError(route)\n\ndef row(title,year,form='TV',audio='E',ident='row1'):\n    return dict(id=ident,title=title,year=year,format=form,audio=audio,matches='magic',group='Live-action TV',imdb='https://www.imdb.com/find/?q=x',top=True,reddit=[])\n\nclass ImportTests(unittest.TestCase):\n    def test_movie_routing_precedes_anime(self):\n        self.assertEqual(m.route(row('Akira',1988,'Anime film')),'radarr')\n        self.assertEqual(m.route(row('A',2000,'Anime OVA')),'sonarr')\n        self.assertEqual(m.route(row('Rebuild of Evangelion',2007,'Anime film series')),'review')\n    def test_remake_and_ambiguity(self):\n        source=row('Dark Matter',2015)\n        candidates=[dict(title='Dark Matter',year=2024,tvdbId=2),dict(title='Dark Matter',year=2015,tvdbId=1)]\n        self.assertEqual(m.exact_match(source,candidates,'tvdbId')['tvdbId'],1)\n        self.assertIsNone(m.exact_match(source,candidates[:1],'tvdbId'))\n        candidates.append(dict(title='Dark Matter',year=2015,tvdbId=3))\n        self.assertIsNone(m.exact_match(source,candidates,'tvdbId'))\n    def test_preview_apply_existing_and_language(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            base=Path(tmp)\n            catalog={'date':'2026-09-18','items':[\n                row('Example',2000,'Anime',ident='first'),\n                row('Example',2000,'Anime OVA',ident='duplicate'),\n                row('Film',2001,'Anime film',ident='movie'),\n                row('Foreign',2002,audio='U',ident='foreign'),\n                row('Partial',2003,audio='P',ident='partial')]}\n            (base/'catalog.json').write_text(json.dumps(catalog))\n            args=SimpleNamespace(catalog=str(base/'catalog.json'),plan=str(base/'plan.json'),scope='all',include_partial=False,limit=0)\n            s=FakeArr('sonarr',[dict(title='Example',year=2000,tvdbId=42,titleSlug='example',seasons=[{'seasonNumber':0,'monitored':True},{'seasonNumber':1,'monitored':True}])])\n            r=FakeArr('radarr',[dict(title='Film',year=2001,tmdbId=84,titleSlug='film')])\n            clients={'sonarr':s,'radarr':r}\n            with patch.object(m.time,'sleep',lambda x:None):\n                m.preview(args,clients)\n                self.assertEqual(s.posts+r.posts,[],'Preview must not POST')\n                plan=json.loads(Path(args.plan).read_text())\n                self.assertEqual(len(plan['rows']),3,'P and U excluded by default')\n                self.assertEqual(sum(x['status']=='ready' for x in plan['rows']),2)\n                self.assertEqual(sum(x['status']=='duplicate' for x in plan['rows']),1)\n                # Simulate an entry added by another user after the preview.\n                r.existing.add(84)\n                self.assertEqual(m.apply(args,clients),0)\n                self.assertEqual(len(s.posts),1)\n                self.assertEqual(len(r.posts),0)\n                payload=s.posts[0]\n                self.assertFalse(payload['monitored'])\n                self.assertTrue(all(not q['monitored'] for q in payload['seasons']))\n                self.assertEqual(payload['seriesType'],'anime')\n                self.assertFalse(payload['addOptions']['searchForMissingEpisodes'])\n                self.assertEqual(m.apply(args,clients),0)\n                self.assertEqual(len(s.posts),1,'Apply rerun must be idempotent')\n    def test_root_change_blocks_before_post(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            s=FakeArr('sonarr',[]);r=FakeArr('radarr',[])\n            plan={'version':1,'instances':{'sonarr':s.url,'radarr':r.url},'rows':[dict(status='ready',app='radarr',database_id=1,payload={'tmdbId':1,'rootFolderPath':'/wrong','qualityProfileId':7})]}\n            path=Path(tmp)/'plan.json';path.write_text(json.dumps(plan))\n            with self.assertRaises(RuntimeError):m.apply(SimpleNamespace(plan=str(path)),{'sonarr':s,'radarr':r})\n            self.assertEqual(s.posts+r.posts,[])\n\nif __name__=='__main__':unittest.main()\n",encoding='utf-8')
#|(out/'IMPORT_GUIDE.md').write_text("# Import the catalog into Sonarr and Radarr\n\nRun the importer on the Linux seedbox where Sonarr and Radarr are installed. The GitHub workflow builds the catalog and includes this script; it does not connect to your seedbox. Credentials stay on the machine running the importer.\n\n## 1. Build and copy\n\nReplace `.github/workflows/build.yml` with the updated file. Open **Actions → Build media catalog → Run workflow**. When the run completes, download its **media-catalog** artifact and extract it.\n\nIn WinSCP, create a `media-catalog` folder in your seedbox home directory. Upload the extracted files directly into it. The same folder should contain `import-catalog.py` and `catalog.json`. These are generated by the one workflow; no extra source files need to be added to GitHub.\n\n## 2. Preview ten entries\n\nOpen the seedbox SSH console and run:\n\n```bash\ncd ~/media-catalog\npython3 import-catalog.py --limit 10\n```\n\nThe script looks for standard Sonarr/Radarr configuration files in your seedbox home directory. If those are absent or the connection fails, it asks for the application's base URL and API key. Include any `/sonarr` or `/radarr` base path. API keys are under **Settings → General** and are entered into a hidden prompt; they are not written to GitHub, the plan or reports.\n\nFor each media category, select an existing root folder and quality profile by its displayed number. The script gets these choices from your applications; it never assumes your folder paths or numeric profile IDs. If a destination you want is missing, configure it in the application's media-management settings and rerun the preview.\n\n| Catalog content | Destination | Series type |\n|---|---|---|\n| Live-action series | Sonarr | Standard |\n| Anime/donghua series | Sonarr | Anime |\n| Western cartoon series | Sonarr | Standard |\n| Live-action movies | Radarr | Not applicable |\n| Anime and cartoon movies | Radarr | Not applicable |\n| Grouped franchises, combined editions and excerpts | Review manually | Individual IDs needed |\n\nThe first preview alternates series and movies so it can exercise both destinations. It creates `import-plan.json` and `import-plan.csv`. It does not add, edit, monitor or search for any title.\n\n## 3. Review the plan\n\nOpen `import-plan.csv` through WinSCP or download it and open it in Excel.\n\n- `ready`: one exact normalized title/alias and year match; a database ID has been resolved.\n- `existing`: that TVDB/TMDB ID is already in the target application; it will remain unchanged.\n- `duplicate`: another catalog record resolved to the same ID.\n- `review`: no unique match, a different database release year, or a combined work requiring individual IDs. The JSON plan lists candidate alternatives where available.\n- `error`: a lookup request failed. It will not be added.\n\nCheck matched titles and years, destination folders, and quality profiles. The catalog's title/year lookup links were not import IDs; this stage resolves TVDB IDs through Sonarr and TMDB IDs through Radarr. Anime seasons, OVAs and specials can have different database organization, so 1,256 catalog rows will not necessarily become 1,256 library entries.\n\nFor `review` entries, use the application's normal Add New search and select the correct release manually. Do not force a guessed ID. A later preview will recognize an entry already present by its database ID when it resolves the catalog title.\n\n## 4. Apply the reviewed preview\n\n```bash\npython3 import-catalog.py --apply\n```\n\nOnly `ready` rows are processed. Every new entry is added **unmonitored**, with all automatic search options disabled. Existing library entries are never edited. The script rechecks existing IDs before applying, making a repeat run skip successful earlier additions.\n\nThe result is saved as `import-plan.applied.json`. If an add fails or times out, the script stops without retrying the write. Check the application and this report before running `--apply` again; previously added IDs will be skipped.\n\n## 5. Preview and import the remaining catalog\n\nAfter confirming the first entries look correct in both applications:\n\n```bash\npython3 import-catalog.py --limit 0 --plan full-import-plan.json\n```\n\nThis previews all English-original and English-dubbed rows, including your supplied examples and the Reddit titles. Review `full-import-plan.csv`, then apply that exact plan:\n\n```bash\npython3 import-catalog.py --apply --plan full-import-plan.json\n```\n\nOptional scopes:\n\n```bash\npython3 import-catalog.py --scope top --limit 0 --plan top-plan.json\npython3 import-catalog.py --scope matches --limit 0 --plan matches-plan.json\npython3 import-catalog.py --scope reddit --limit 0 --plan reddit-plan.json\n```\n\n`--include-partial` also allows partial-dub and wordless entries into a preview. It still excludes unverified dubs and substantially multilingual titles. The default excludes those conditional categories. A later run replaces the named plan, so use a distinct filename to keep an earlier preview.\n\n## 6. Enable downloads for selected entries\n\nFirst check the actual release rules in your chosen quality profiles and custom formats. The catalog's English labels only indicate that an English version exists; they do not enforce English audio on release selection. Dual-audio anime is acceptable only when it includes English, and a partial-dub franchise may require selecting particular seasons or episodes.\n\nAfter verifying the first batch, enable monitoring for the films or series/seasons you want, then start searches in Radarr or Sonarr. Their already-configured indexers and download client perform the searches and downloads. The importer itself never starts a search.\n\n## Technical scope and validation\n\nRequires Python 3.8+ and the standard library, plus network access from the seedbox to your Sonarr/Radarr APIs and their metadata providers. Uses `/api/v3/system/status`, `/rootfolder`, `/qualityprofile`, `/series`, `/series/lookup`, `/movie` and `/movie/lookup`.\n\nThe workflow runs offline importer tests covering film-versus-series routing, remake years, ambiguous matches, duplicate IDs, read-only previews, existing-entry protection, unmonitored additions and rerun behavior. Live compatibility with your installed instances is established by the initial preview and small apply, not by the offline tests.\n\nOfficial API references: [Sonarr API](https://sonarr.tv/docs/api/) and [Radarr API](https://radarr.video/docs/api/).\n",encoding='utf-8')
